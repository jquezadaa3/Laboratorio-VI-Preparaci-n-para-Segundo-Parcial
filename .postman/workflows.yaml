# This is a Workflow metadata file for defining entity relationships in this workspace.
# Each workflow defines relations between entities and may include optional behavior/settings.
# The Paths are relative to the .postman directory (avoid absolute paths).
# Keep relation entries explicit and avoid duplicate pairs within the same workflow.
# This file is declarative metadata and does not execute workflows by itself.
workflows:
  syncSpecToCollection:
    - spec: ../postman/specs/API de Biblioteca/biblioteca-api.yaml
      collection: ../postman/collections/API de Biblioteca
      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: ../postman/specs/API de Reservas de Hotel/hotel-api.yaml
      collection: ../postman/collections/API de Reservas de Hotel
      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: ../postman/specs/API de Cursos Universitarios/cursos-api.yaml
      collection: ../postman/collections/API de Cursos Universitarios
      options:
        syncExamples: false
        deleteOrphanedRequests: false
  syncCollectionToSpec:
    - spec: ../postman/specs/API de Biblioteca/biblioteca-api.yaml
      collection: ../postman/collections/API de Biblioteca
      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: ../postman/specs/API de Reservas de Hotel/hotel-api.yaml
      collection: ../postman/collections/API de Reservas de Hotel
      options:
        syncExamples: false
        deleteOrphanedRequests: false
    - spec: ../postman/specs/API de Cursos Universitarios/cursos-api.yaml
      collection: ../postman/collections/API de Cursos Universitarios
      options:
        syncExamples: false
        deleteOrphanedRequests: false
