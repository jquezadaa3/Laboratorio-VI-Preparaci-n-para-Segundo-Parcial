openapi: 3.0.3
info:
  title: API de Biblioteca
  description: API para administrar los libros de una biblioteca - Laboratorio VI, Ejercicio 1
  version: 1.0.0
servers:
  - url: http://localhost:8081/api

paths:
  /libros:
    post:
      summary: Registrar un nuevo libro
      operationId: registrarLibro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '201':
          description: Libro creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '400':
          description: Datos inválidos en la solicitud
    get:
      summary: Consultar todos los libros
      operationId: consultarLibros
      responses:
        '200':
          description: Lista de libros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibroResponse'

  /libros/titulo/{titulo}:
    get:
      summary: Consultar libro por título
      operationId: consultarLibroPorTitulo
      parameters:
        - name: titulo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '404':
          description: Libro no encontrado

  /libros/{id}:
    put:
      summary: Actualizar libro existente
      operationId: actualizarLibro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '200':
          description: Libro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '404':
          description: Libro no encontrado
    delete:
      summary: Eliminar libro
      operationId: eliminarLibro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Libro eliminado exitosamente
        '404':
          description: Libro no encontrado

components:
  schemas:
    LibroRequest:
      type: object
      required: [titulo, autor, isbn, anioPublicacion, estado]
      properties:
        titulo:
          type: string
          example: Cien años de soledad
        autor:
          type: string
          example: Gabriel García Márquez
        isbn:
          type: string
          example: 978-0307474728
        anioPublicacion:
          type: integer
          example: 1967
        estado:
          type: string
          enum: [DISPONIBLE, PRESTADO, EN_REPARACION]
          example: DISPONIBLE

    LibroResponse:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/LibroRequest'
