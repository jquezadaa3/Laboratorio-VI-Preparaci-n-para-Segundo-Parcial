$kind: http-example
request:
  url: "{{baseUrl}}/cursos"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "nombre": "Programación II",
        "codigo": "PROG-201",
        "creditos": 5,
        "estado": "ACTIVO"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "nombre": "Programación II",
        "codigo": "PROG-201",
        "creditos": 5,
        "estado": "ACTIVO",
        "id": 1
      }
    $type: |-
      {
        "allOf": [
          {
            "type": "object",
            "properties": {
              "id": {
                "type": "integer",
                "example": 1,
                "format": "int64"
              }
            }
          },
          {
            "type": "object",
            "properties": {
              "nombre": {
                "type": "string",
                "example": "Programación II"
              },
              "codigo": {
                "type": "string",
                "example": "PROG-201"
              },
              "creditos": {
                "type": "integer",
                "example": 5
              },
              "estado": {
                "type": "string",
                "enum": [
                  "ACTIVO",
                  "INACTIVO"
                ],
                "example": "ACTIVO"
              }
            },
            "required": [
              "nombre",
              "codigo",
              "creditos",
              "estado"
            ]
          }
        ]
      }
order: 1000
