openapi: 3.0.3
info:
  title: API de Cursos Universitarios
  description: API para administrar cursos universitarios - Laboratorio VI, Ejercicio 2
  version: 1.0.0
servers:
  - url: http://localhost:8082/api

paths:
  /cursos:
    post:
      summary: Crear curso
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '201':
          description: Curso creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          description: Datos inválidos en la solicitud
    get:
      summary: Consultar todos los cursos
      operationId: consultarCursos
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CursoResponse'

  /cursos/codigo/{codigo}:
    get:
      summary: Consultar curso por código
      operationId: consultarCursoPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '404':
          description: Curso no encontrado

  /cursos/{id}:
    put:
      summary: Actualizar curso existente
      operationId: actualizarCurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '404':
          description: Curso no encontrado
    delete:
      summary: Eliminar curso
      operationId: eliminarCurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Curso eliminado exitosamente
        '404':
          description: Curso no encontrado

components:
  schemas:
    CursoRequest:
      type: object
      required: [nombre, codigo, creditos, estado]
      properties:
        nombre:
          type: string
          example: Programación II
        codigo:
          type: string
          example: PROG-201
        creditos:
          type: integer
          example: 5
        estado:
          type: string
          enum: [ACTIVO, INACTIVO]
          example: ACTIVO

    CursoResponse:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/CursoRequest'
